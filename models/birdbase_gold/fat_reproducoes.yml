version: 2

models:
  - name: fat_reproducoes
    description: >
      Fato analítico de reprodução de aves, contendo informações
      sobre ninhadas, ovos, incubação, período de fledging e
      comportamentos relacionados a parasitismo de ninho.

    tests:
      - unique:
          arguments:
            column_name: id_ave
      - not_null:
          arguments:
            column_name: id_ave

    columns:

      # Identificação e taxonomia
      - name: id_ave
        description: Identificador único da ave.

      - name: sgk_ordem
        description: Chave substituta da ordem taxonômica.

      - name: tp_ordem_latin
        description: Nome da ordem taxonômica em latim.

      - name: ds_ordem
        description: Nome comum da ordem taxonômica em português.

      - name: nm_cientifico
        description: Nome científico da espécie.

      - name: tp_ds_ordem
        description: Ordem taxonômica formatada (latim + português).

      # Ninhadas e ovos
      - name: nr_ninhada_minima_anual
        description: Número mínimo de ninhadas por ano.

      - name: nr_ninhada_maxima_anual
        description: Número máximo de ninhadas por ano.

      - name: nr_ovos_minimo_por_ninhada
        description: Número mínimo de ovos por ninhada.
