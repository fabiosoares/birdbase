version: 2

models:
  - name: fat_visao_geral
    description: >
      Visão geral taxonômica das aves, contendo identificação,
      classificação biológica (ordem, família, gênero e espécie)
      e nomes científicos associados.

    tests:
      - unique:
          arguments:
            column_name: id_ave
      - not_null:
          arguments:
            column_name: id_ave

    columns:

      # Identificação
      - name: id_ave
        description: Identificador único da ave.

      # Ordem taxonômica
      - name: sgk_ordem
        description: Chave substituta da ordem taxonômica.

      - name: tp_ordem_latin
        description: Nome da ordem taxonômica em latim.

      - name: ds_ordem
        description: Nome comum da ordem taxonômica em português.

      - name: tp_ds_ordem
        description: Ordem taxonômica formatada (latim + português).

      # Classificação biológica
      - name: tp_familia
        description: Família taxonômica da espécie.

      - name: tp_genero
        description: Gênero taxonômico da espécie.

      - name: tp_especie
        description: Espécie taxonômica.
        
      - name: nm_cientifico
        description: Nome científico da espécie.

      - name: nm_popular
        description: Nome popular priorizando português; fallback para inglês.
