version: 2

models:
  - name: fat_conservacao_biogeografia
    description: >
      Fato analítico de aves com foco em conservação e biogeografia,
      consolidando status de conservação, reino biogeográfico,
      faixa latitudinal e indicadores de restrição geográfica.

    tests:
      - unique:
          arguments:
            column_name: id_ave
      - not_null:
          arguments:
            column_name: id_ave

    columns:

      # Identificação
      - name: id_ave
        description: Identificador único da ave.

      # Conservação
      - name: sgk_status_conservacao
        description: Chave substituta do status de conservação (IUCN).

      - name: nm_portugues
        description: Nome do status de conservação em português.

      # Biogeografia
      - name: sgk_reino_biogeografico
        description: Chave do reino biogeográfico de ocorrência.

      - name: nm_reino_biogeografico
        description: Reino biogeográfico formatado (código + nome em português).

      # Taxonomia
      - name: nm_cientifico
        description: Nome científico da espécie.

      - name: nm_popular
        description: Nome popular priorizando português; fallback para inglês.

      # Indicadores geográficos
      - name: is_alcance_global_restrito
        description: Indica se a espécie possui alcance geográfico global restrito.

      - name: is_reproducao_restrita_ilhas
        description: Indica se a reprodução ocorre exclusivamente em ilhas.

      - name: tp_faixa_latitudinal
        description: Faixa latitudinal de ocorrência da espécie.
