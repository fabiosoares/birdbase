---
version: 2

models:
  - name: fat_aves
    description: >
      Tabela fato que contém informações detalhadas sobre os pássaros, incluindo suas 
      características biológicas, status de conservação e dados geográficos.
    tags: ['birdbase', 'fat']
    columns:
      - name: id_ave
        description: "Chave única da ave"
        tests:
          - not_null
          - unique

      - name: nome_cientifico
        description: "Nome científico da ave"
        tests:
          - not_null
          - unique

      - name: sgk_ordem
        description: "Chave estrangeira referenciando a ordem taxonômica da ave"
        tests:
          - not_null

      - name: tp_familia
        description: "Tipo da família taxonômica da ave"
      
      - name: tp_genero
        description: "Tipo do gênero taxonômico da ave"
        tests:
          - not_null

      - name: tp_especie
        description: "Tipo da espécie taxonômica da ave"
        tests:
          - not_null

      - name: sgk_status_conservacao
        description: "Chave estrangeira referenciando o status de conservação da ave"

      - name: sgk_reino_biogeografico
        description: "Chave estrangeira referenciando o reino biogeográfico da ave"
        tests:
          - not_null

      - name: is_alcance_global_restrito
        description: >
          Indica se o alcance global do pássaro é restrito (booleano).
          Isso significa que a espécie ocorre em uma área menor que 50.000 km² no mundo todo.
        tests:
          - accepted_values:
              values: [true, false, null]

      - name: is_reproducao_restrita_ilhas
        description: >
          Indica se a reprodução do pássaro é restrita a ilhas (booleano).
          Isso significa que a espécie se reproduz exclusivamente em ilhas.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      
      - name: id_faixa_latitudinal
        description: "Chave estrangeira referenciando a faixa latitudinal do pássaro"
        tests:
          - not_null

      # 4. Habitat e Dieta
      - name: is_habitat_florestal
        description: >
          Indica se o habitat principal da ave é florestal (booleano).
        tests:
          - not_null
          - accepted_values:
              values: [true, false] 

      - name: is_habitat_bambu
        description: "Booleano. Indica se 'bambu' está listado como habitat no registro."
      - name: is_habitat_bosque
        description: "Booleano. Indica se 'bosque' está listado como habitat no registro."
      - name: is_habitat_arbustos
        description: "Booleano. Indica se 'arbustos' está listado como habitat no registro."
      - name: is_habitat_savana
        description: "Booleano. Indica se 'savana' está listado como habitat no registro."
      - name: is_habitat_pastagens
        description: "Booleano. Indica se 'pastagens' está listado como habitat no registro."
      - name: is_habitat_planicies
        description: "Booleano. Indica se 'planícies' está listado como habitat no registro."
      - name: is_habitat_areas_rochosas
        description: "Booleano. Indica se 'áreas rochosas' está listado como habitat no registro."
      - name: is_habitat_artificial
        description: "Booleano. Indica se ambientes artificiais estão listados como habitat no registro."
      - name: is_habitat_riparia
        description: "Booleano. Indica se 'ripária' (margem de corpos d'água) está listada como habitat no registro."
      - name: is_habitat_costa_maritma
        description: "Booleano. Indica se 'costa/marítima' está listada como habitat no registro."
      - name: is_habitat_zonas_umidas
        description: "Booleano. Indica se zonas úmidas estão listadas como habitat no registro."
      - name: is_habitat_mar_aberto
        description: "Booleano. Indica se 'mar aberto' está listado como habitat no registro."
      - name: is_habitat_outros
        description: "Booleano. Indica se o habitat foi classificado como 'outros' no registro."
      - name: ds_habitat_outros
        description: "Booleano. Flag que indica presença de descrição adicional para 'outros' habitats (campo d.o_desc convertido para booleano)."
      - name: sgk_habitat_principal
        description: "Chave estrangeira referenciando o habitat principal da ave"
      - name: qtd_habitats_principais
        description: "Inteiro. Quantidade de habitats principais associados ao registro (campo d.hb)."
      # 4.2 Dieta
      - name: sgk_dieta
        description: "Chave estrangeira referenciando a dieta primária da ave"
        tests:
          - not_null
      - name: vl_dieta_peso_invertebrados
        description: "Valor percentual do peso da dieta composto por invertebrados"
      - name: vl_dieta_peso_frutas
        description: "Valor percentual do peso da dieta composto por frutas"
      - name: vl_dieta_peso_nectar
        description: "Valor percentual do peso da dieta composto por néctar"
      - name: vl_dieta_peso_sementes
        description: "Valor percentual do peso da dieta composto por sementes"
      - name: vl_dieta_peso_vertebrados_terrestres
        description: "Valor percentual do peso da dieta composto por vertebrados terrestres"
      - name: vl_dieta_peso_peixes
        description: "Valor percentual do peso da dieta composto por peixes"
      - name: vl_dieta_peso_carniceiros
        description: "Valor percentual do peso da dieta composto por carniceiros"
      - name: vl_dieta_peso_vegetal_nao_reprodutivo
        description: "Valor percentual do peso da dieta composto por material vegetal não reprodutivo"
      - name: vl_dieta_peso_diversificada
        description: "Valor percentual do peso da dieta composto por diversos"
      - name: vl_dieta_ponderada_total
        description: "Valor percentual do peso da dieta composto por outros itens"
      - name: ds_dieta
        description: "Descrição adicional da dieta informada no registro"
      - name: qtd_tp_alimentos_principais_consumidos
        description: "Quantidade de tipos de alimentos principais consumidos pela ave"
      - name: nr_esi_indice_especializacao_ecologica

      # 5.1 Comportamento Social
      - name: is_comportamento_colonial
        description: "Indica se o comportamento social da ave é colonial (booleano)."
      - name: is_comportamento_forma_bando
        description: "Indica se o comportamento social da ave é formar bando (booleano)."
      - name: is_comportamento_pares_grupos_familiares
        description: "Indica se o comportamento social da ave é viver em pares ou grupos familiares (booleano)."
      - name: is_comportamento_solitario_pares
        description: "Indica se o comportamento social da ave é viver solitário ou em pares (booleano)."
      - name: is_comportamento_solitario
        description: "Indica se o comportamento social da ave é solitário (booleano)."
      - name: is_comportamento_exibicao_cortejo_grupo
        description: "Indica se o comportamento social da ave inclui exibição ou cortejo em grupo (booleano)."
      - name: is_monogamia
        description: "Indica se o padrão de acasalamento da ave é monogâmico (booleano)."
      - name: is_poligamia
        description: "Indica se o padrão de acasalamento da ave é poligâmico (booleano)."
      - name: is_criacao_cooperativa
        description: "Indica se o padrão de criação da ave é cooperativo (booleano)." 
      
      # 5.2 Reprodução

