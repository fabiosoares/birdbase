---
version: 2

models:
  - name: fat_dietas
    description: >
      Tabela fato que agrega informações detalhadas sobre os pássaros,
      incluindo suas características biológicas
      - name: id_ave
        description: "Chave única da ave"
        tests:
          - not_null
          - unique
      - name: sgk_ordem
        description: "Chave estrangeira para a ordem da ave"
        tests:
          - not_null
      - name: tp_ordem_latin
        description: "Nome científico da ordem da ave"
      - name: ds_ordem
        description: "Composição da ordem da ave"
      - name: nm_cientifico
        description: "Nome científico da ave"
      - name: tp_ds_ordem
        description: "Combinação do nome científico e descrição da ordem"
      - name: vl_dieta_peso_invertebrados
        description: "Peso percentual de invertebrados na dieta da ave"
      - name: vl_dieta_peso_frutas
        description: "Peso percentual de frutas na dieta da ave"
      - name: vl_dieta_peso_nectar
        description: "Peso percentual de néctar na dieta da ave"
      - name: vl_dieta_peso_sementes
        description: "Peso percentual de sementes na dieta da ave"
      - name: vl_dieta_peso_vertebrados_terrestres
        description: "Peso percentual de vertebrados terrestres na dieta da ave"
      - name: vl_dieta_peso_peixes
        description: "Peso percentual de peixes na dieta da ave"
      - name: vl_dieta_peso_carniceiros
        description: "Peso percentual de carniceiros na dieta da ave"
      - name: vl_dieta_peso_vegetal_nao_reprodutivo
        description: "Peso percentual de material vegetal não reprodutivo na dieta da ave"
      - name: vl_dieta_peso_diversificada
        description: "Peso percentual de dieta diversificada na dieta da ave"
      - name: vl_dieta_ponderada_total
        description: "Peso total ponderado da dieta da ave"
      - name: ds_dieta
        description: "Descrição detalhada da dieta da ave"
      - name: qtd_tp_alimentos_principais_consumidos
        description: "Quantidade de tipos principais de alimentos consumidos pela ave"
      - name: tp_dieta_portugues
        description: "Tipo da dieta (português)"