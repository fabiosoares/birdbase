version: 2

models:
  - name: fat_comportamentos_sociais
    description: >
      Fato analítico de aves com foco exclusivo em comportamento social,
      consolidando informações taxonômicas básicas e padrões comportamentais
      a partir da fat_aves e da dimensão de ordens.

    tests:
      - unique:
          arguments:
            column_name: id_ave
      - not_null:
          arguments:
            column_name: id_ave

    columns:

      # Identificação
      - name: id_ave
        description: Identificador único da ave.

      - name: sgk_ordem
        description: Chave substituta da ordem taxonômica.

      - name: tp_ordem_latin
        description: Nome da ordem taxonômica em latim.

      - name: ds_ordem
        description: Nome comum da ordem taxonômica em português.

      - name: nm_cientifico
        description: Nome científico da espécie.

      - name: nm_popular
        description: Nome popular priorizando português; fallback para inglês.

      - name: tp_ds_ordem
        description: Ordem taxonômica formatada (latim + português).

      # Comportamento social
      - name: tp_comportamento_colonial
        description: Indica se a espécie apresenta comportamento colonial.

      - name: is_comportamento_forma_bando
        description: Indica se a espécie forma bandos.

      - name: is_comportamento_pares_grupos_familiares
        description: Indica ocorrência em pares ou grupos familiares.

      - name: tp_comportamento_solitario_pares
        description: Indica comportamento solitário em pares.

      - name: tp_comportamento_solitario
        description: Indica comportamento estritamente solitário.

      - name: tp_comportamento_monogamia
        description: Indica sistema reprodutivo monogâmico.

      - name: tp_comportamento_poligamia
        description: Indica sistema reprodutivo poligâmico.

      - name: tp_comportamento_criacao_cooperativa
        description: Indica criação cooperativa de filhotes.
